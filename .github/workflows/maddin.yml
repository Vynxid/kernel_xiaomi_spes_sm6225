name: Apply SUSFS Patch (Kernel 4.19)

on:
  workflow_dispatch:

jobs:
  apply-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Download SUSFS patch (for 4.19)
        run: |
          wget https://raw.githubusercontent.com/Frostleaft07/KernelSU-Patch/refs/heads/main/susfs-k4.19/SUSFS-v1.5.10-Kernel-v4.19.x.patch
          ls -lh SUSFS-v1.5.10-Kernel-v4.19.x.patch

      - name: Create working branch
        run: |
          BRANCH="susfs-patch-$(date +%s)"
          git checkout -b "$BRANCH"
          echo "Using branch: $BRANCH" > branch.txt

      - name: Apply patch (force fuzz)
        run: |
          echo "🩹 Applying SUSFS patch with fuzz=3 and ignore whitespace..."
          patch -p1 --ignore-whitespace --fuzz=3 < SUSFS-v1.5.10-Kernel-v4.19.x.patch || true

          echo ""
          echo "=== PATCH SUMMARY ==="
          echo "Files with .rej (failed hunks):"
          find . -type f -name "*.rej" || true
          echo ""
          echo "=== git status after patch ==="
          git status --short || true

      - name: Commit patched files
        run: |
          git add -A
          git commit -m "Apply SUSFS v1.5.10 patch (kernel 4.19) via CI" || echo "No changes to commit."

      - name: Push branch
        run: |
          BRANCH=$(cat branch.txt)
          git push origin "$BRANCH"
          echo "✅ Pushed patched branch: $BRANCH"
