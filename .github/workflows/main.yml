name: Add SUSFS to Kernel (Simple Copy Mode)

on:
  workflow_dispatch:

jobs:
  add-susfs:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone SUSFS source (ASUS SDM660)
        run: |
          echo "🧩 Cloning SUSFS source..."
          git clone https://github.com/rsuplaygrnd/android_kernel_asus_sdm660 susfs-src --depth=1

      - name: Copy SUSFS files into your kernel tree
        run: |
          echo "📦 Copying SUSFS core files..."
          cp -r susfs-src/fs/susfs* fs/ || true
          cp -r susfs-src/include/linux/susfs* include/linux/ || true

          echo "🧱 Updating fs/Makefile..."
          echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b susfs-added
          git add fs/susfs* include/linux/susfs* fs/Makefile
          git commit -m "Add SUSFS (copied from ASUS SDM660)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" susfs-added

          echo "✅ SUSFS files successfully added to branch 'susfs-added'"
