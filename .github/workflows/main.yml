name: Build Kernel (4.9 - crDroid)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 6"
  push:
    branches:
      - HEAD
  pull_request:
    branches:
      - HEAD

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: "vendor/bengal-perf_defconfig"
      KERNEL_CMDLINE: "ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 100

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt install gcc-aarch64-linux-gnu -y
          sudo apt install gcc-arm-linux-gnueabi -y
          sudo apt install aria2 binutils make python3 libssl-dev build-essential bc bison flex unzip libssl-dev ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs curl wget jq -y

      - name: Download GreenForce Clang
        run: |
          echo "Downloading GreenForce Clang 22.0.0..."
          wget -q https://github.com/greenforce-project/greenforce_clang/releases/download/20251012/gf-clang-22.0.0git-20251012.tar.gz
          mkdir -p greenforce-clang
          tar -xzf gf-clang-22.0.0git-20251012.tar.gz -C greenforce-clang
          rm gf-clang-22.0.0git-20251012.tar.gz
          echo "GreenForce Clang extracted successfully"

      - name: Setup SUSFS
        run: |
          echo "Setting up SUSFS..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki

      - name: Get Build Information
        id: build_info
        run: |
          # Get kernel version
          KERNEL_VERSION=$(make kernelversion 2>/dev/null || echo "Unknown")
          echo "kernel_version=${KERNEL_VERSION}" >> $GITHUB_OUTPUT
          
          # Get clang version
          export PATH=$(pwd)/greenforce-clang/bin/:$PATH
          CLANG_VERSION=$(clang --version | head -n1)
          echo "clang_version=${CLANG_VERSION}" >> $GITHUB_OUTPUT
          
          # Get branch info
          BRANCH_NAME=${GITHUB_REF##*/}
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          
          # Get commit info
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n1)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "commit_msg=${COMMIT_MSG}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          
          # Build start time
          BUILD_START=$(date '+%Y-%m-%d %H:%M:%S UTC')
          echo "build_start=${BUILD_START}" >> $GITHUB_OUTPUT
          echo "build_start_ts=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Send Build Start Notification
        run: |
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="🔨 <b>Kernel Build Started</b>
            📱 <b>Device:</b> Bengal (4.9)
            🌿 <b>Branch:</b> <code>${{ steps.build_info.outputs.branch }}</code>
            📝 <b>Commit:</b> <code>${{ steps.build_info.outputs.commit_sha }}</code>
            💬 <b>Message:</b> ${{ steps.build_info.outputs.commit_msg }}
            
            🐧 <b>Linux:</b> ${{ steps.build_info.outputs.kernel_version }}
            🔧 <b>Compiler:</b> GreenForce Clang 22.0.0
            ⏰ <b>Started:</b> ${{ steps.build_info.outputs.build_start }}

            ⚙️ Building kernel with Sukisu..."

      - name: Build Kernel-With-KernelSU
        id: build_kernel
        run: |
          export PATH=$(pwd)/greenforce-clang/bin/:$PATH
          
          echo "Starting kernel build..."
          BUILD_START=$(date +%s)
          
          make $KERNEL_CMDLINE $KERNEL_DEFCONFIG CC="ccache clang" 2>&1 | tee build_config.log
          make $KERNEL_CMDLINE CC="ccache clang" -j$(nproc --all) 2>&1 | tee build.log
          
          BUILD_END=$(date +%s)
          BUILD_TIME=$((BUILD_END - BUILD_START))
          BUILD_TIME_MIN=$((BUILD_TIME / 60))
          BUILD_TIME_SEC=$((BUILD_TIME % 60))
          
          echo "build_time=${BUILD_TIME_MIN}m ${BUILD_TIME_SEC}s" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
          
      - name: Prepare Build Logs
        if: always()
        run: |
          # Create build summary
          cat > build_summary.txt << EOF
          ═══════════════════════════════════════
          KERNEL BUILD SUMMARY
          ═══════════════════════════════════════
          
          Build Configuration:
          • Linux Version: ${{ steps.build_info.outputs.kernel_version }}
          • Compiler: GreenForce Clang 22.0.0
          • Branch: ${{ steps.build_info.outputs.branch }}
          • Commit: ${{ steps.build_info.outputs.commit_sha }}
          
          Build Details:
          • Started: ${{ steps.build_info.outputs.build_start }}
          • Duration: ${{ steps.build_kernel.outputs.build_time }}
          • Status: ${{ steps.build_kernel.outputs.status || 'failed' }}
          
          Features:
          • KernelSU: Enabled
          • SUSFS: Enabled
          • Kernel Patcher: Applied
          
          ═══════════════════════════════════════
          EOF
          
          # Append last 50 lines of build log
          echo "" >> build_summary.txt
          echo "Last 50 lines of build log:" >> build_summary.txt
          echo "-----------------------------------" >> build_summary.txt
          tail -n 50 build.log >> build_summary.txt || echo "No build log available" >> build_summary.txt

      - name: Get File Sizes
        if: success()
        id: file_info
        run: |
          IMAGE_SIZE=$(du -h out/arch/arm64/boot/Image.gz | cut -f1)
          DTBO_SIZE=$(du -h out/arch/arm64/boot/dtbo.img | cut -f1)
          echo "image_size=${IMAGE_SIZE}" >> $GITHUB_OUTPUT
          echo "dtbo_size=${DTBO_SIZE}" >> $GITHUB_OUTPUT

      - name: Send Success Notification with Files
        if: success()
        run: |
          # Send success message
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="✅ <b>Kernel Build Successful!</b>

           📱 <b>Device:</b> Spes/n (4.19)
           🌿 <b>Branch:</b> <code>${{ steps.build_info.outputs.branch }}</code>
           📝 <b>Commit:</b> <code>${{ steps.build_info.outputs.commit_sha }}</code>

          🐧 <b>Linux:</b> ${{ steps.build_info.outputs.kernel_version }}
          🔧 <b>Compiler:</b> GreenForce Clang 22.0.0
          ⏱ <b>Build Time:</b> ${{ steps.build_kernel.outputs.build_time }}

          📦 <b>Output Files:</b>
          • Image.gz: ${{ steps.file_info.outputs.image_size }}
          • dtbo.img: ${{ steps.file_info.outputs.dtbo_size }}

          ✨ Features: SukiSu

          📄 Build log will be sent shortly..."

          # Send build summary
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@build_summary.txt \
            -F caption="📝 Build Summary & Log"

          # Send Image.gz
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@out/arch/arm64/boot/Image.gz \
            -F caption="📦 Kernel Image (Image.gz)"

          # Send dtbo.img
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@out/arch/arm64/boot/dtbo.img \
            -F caption="📦 DTBO Image (dtbo.img)"

      - name: Send Failure Notification
        if: failure()
        run: |
          # Get last 30 lines of error log
          ERROR_LOG=$(tail -n 30 build.log 2>/dev/null || echo "No build log available")
          
          # Create error summary
          cat > error_summary.txt << EOF
          ═══════════════════════════════════════
          KERNEL BUILD FAILED
          ═══════════════════════════════════════
          
          Build Configuration:
          • Linux Version: ${{ steps.build_info.outputs.kernel_version }}
          • Compiler: GreenForce Clang 22.0.0
          • Branch: ${{ steps.build_info.outputs.branch }}
          • Commit: ${{ steps.build_info.outputs.commit_sha }}
          
          Error Log (last 30 lines):
          -----------------------------------
          ${ERROR_LOG}
          ═══════════════════════════════════════
          EOF
          
          # Send failure message
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>Kernel Build Failed!</b>

            📱 <b>Device:</b> Bengal (4.9)
            🌿 <b>Branch:</b> <code>${{ steps.build_info.outputs.branch }}</code>
            📝 <b>Commit:</b> <code>${{ steps.build_info.outputs.commit_sha }}</code>

            🐧 <b>Linux:</b> ${{ steps.build_info.outputs.kernel_version }}
            🔧 <b>Compiler:</b> GreenForce Clang 22.0.0

            ⚠️ Check the error log for details."

          # Send error log
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@error_summary.txt \
            -F caption="📝 Error Log"

      - name: Upload Artifacts (Backup)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Build-${{ steps.build_info.outputs.commit_sha }}
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
            build_summary.txt
          retention-days: 7
